name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy pybind11 ruff==0.16.9
      - name: Build
        run: make build
      - name: Test (C++, Python, differential)
        run: make test
      - name: Demo run
        run: make demo

  quality:
    name: lint + sanitizers + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format-18 clang-tidy-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy
          python -m pip install numpy pybind11 ruff==0.16.9 gcovr coverage
      - name: Lint
        run: make lint
      - name: Sanitizers (ASan, UBSan, TSan)
        run: make build sanitize
      - name: Coverage
        run: make coverage
