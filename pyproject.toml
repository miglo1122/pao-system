[project]
name = "pao"
version = "1.0.0"
description = "Проактивний адміністративний нагляд за кібербезпекою транспортних мереж і логістичних хабів (модель за NIS2)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
native = ["pybind11>=2.11"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["UP007", "UP006", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pao"]
